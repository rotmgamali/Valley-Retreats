<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Valley Retreats</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/coming-soon.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Subtle dark gradient overlay to make text pop at bottom */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, transparent 100%);
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding-bottom: 8vh;
            width: 100%;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 10vw, 6rem);
            color: #fff;
            margin: 0;
            font-style: italic;
            font-weight: 400;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg-image"></div>
        <div class="overlay"></div>
        <div class="content">
            <h1>Coming Soon</h1>
        </div>
    </div>
</body>

</html>
